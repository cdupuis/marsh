[package]
name = "marsh-host-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.23"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rust]
# The only exceptions are the two syscall wrappers in the native module: the
# descriptor fgetattrlist call (`read`) and `clonefileat` (`clone_at`).
unsafe_code = "deny"

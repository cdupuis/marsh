\* KitInstall Bug=snapshotRunning (a lost job's container is created, its start pending; the check lists running containers only)
SPECIFICATION Spec
CONSTANTS
  NN = 4
  MaxAttempts = 2
  MaxJobs = 1
  MaxResets = 2
  MaxSwitches = 1
  MaxTeardowns = 1
  MaxStops = 0
  MaxRestarts = 1
  MaxLate = 1
  FailedMayLand = TRUE
  InstallKits = {"a"}
  Actors = {"run", "restart", "rcv"}
  Bug = "snapshotRunning"
INVARIANTS
  NoRunningRemoval
